<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avisos y comunicados · CEB 9/22 Mazatlán</title>
  <meta name="description" content="Avisos y comunicados oficiales del CEB 9/22 de Mazatlán: inscripciones, becas, calendario, eventos y comunicación de la Dirección.">
  <link rel="icon" type="image/png" href="favicon.png?v=30">
  <link rel="stylesheet" href="css/estilos.css?v=30">
</head>
<body data-pagina="avisos">
  <div id="encabezado"></div>

  <main id="contenido">
    <section class="hero hero--interior">
      <div class="contenedor">
        <span class="kicker kicker--claro">Comunicación oficial</span>
        <h1>Avisos y comunicados</h1>
        <p class="hero-sub">Los comunicados de la Dirección, cada uno con su fecha. Solo es oficial lo publicado aquí y en los canales del plantel.</p>
      </div>
      <svg class="ola" viewBox="0 0 1440 64" preserveAspectRatio="none" aria-hidden="true"><path class="ola-tras" d="M0,22 C240,58 480,-6 720,10 C960,26 1200,54 1440,16 L1440,64 L0,64 Z"/><path class="ola-frente" d="M0,38 C240,70 480,6 720,22 C960,38 1200,62 1440,30 L1440,64 L0,64 Z"/></svg>
    </section>

    <section class="seccion seccion--apretada">
      <div class="contenedor">
        <div class="filtros">
          <div class="filtro-campo">
            <label for="filtro-categoria">Categoría</label>
            <select id="filtro-categoria">
              <option value="">Todas</option>
              <option value="inscripciones">Inscripciones</option>
              <option value="becas">Becas</option>
              <option value="academico">Académico</option>
              <option value="eventos">Eventos</option>
              <option value="urgente">Urgente</option>
              <option value="comunidad">Comunidad</option>
            </select>
          </div>
          <div class="filtro-campo">
            <label for="filtro-mes">Mes</label>
            <select id="filtro-mes">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="filtro-campo" style="flex-grow:2">
            <label for="filtro-busqueda">Buscar</label>
            <input type="search" id="filtro-busqueda" placeholder="Ej. inscripciones, beca, examen…">
          </div>
        </div>

        <h2 class="sr-only">Todos los avisos</h2>
        <div class="rejilla rejilla-2" id="lista-avisos"></div>

        <div class="nota mt-6">
          <p>¿Buscas saber si <strong>hoy hay clases</strong>? Tiene su propia página, siempre actualizada: <a href="estatus.html">¿Hay clases hoy?</a></p>
        </div>
      </div>
    </section>
  </main>

  <div id="pie"></div>

  <script src="datos/config.js?v=30"></script>
  <script src="datos/estatus.js?v=30"></script>
  <script src="datos/avisos.js?v=30"></script>
  <script src="js/app.js?v=30"></script>
</body>
</html>
